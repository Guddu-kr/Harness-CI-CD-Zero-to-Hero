# ============================================
# SECRET — Sensitive data for GoCart + PostgreSQL
#
# {{ .Values.postgres.user }}     → reads "postgres.user" from values.yaml → "gocart"
# {{ .Values.postgres.password }} → reads "postgres.password" from values.yaml → "gocart123"
# {{ .Values.postgres.database }} → reads "postgres.database" from values.yaml → "gocart"
# | quote                         → wraps value in quotes (safe for YAML)
# ============================================
apiVersion: v1
kind: Secret
metadata:
  name: gocart-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "gocart.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  DATABASE_URL: "postgresql://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres:5432/{{ .Values.postgres.database }}"
  DIRECT_URL: "postgresql://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres:5432/{{ .Values.postgres.database }}"
  SESSION_SECRET: "harness-course-session-secret-2024"
