apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shop-ecommerce-alerts
  namespace: monitoring
  labels:
    release: prometheus
    app: kube-prometheus-stack
spec:
  groups:
    - name: shop-ecommerce.rules
      rules:
        - alert: HighErrorRate
          expr: |
            sum(rate(nginx_http_requests_total{status=~"5.."}[5m])) by (namespace)
            / sum(rate(nginx_http_requests_total[5m])) by (namespace) > 0.05
          for: 2m
          labels:
            severity: critical
            app: shop-ecommerce
          annotations:
            summary: "High error rate detected in shop-ecommerce"
            description: "Error rate is above 5% for 2 minutes. Current value: {{ $value | humanizePercentage }}"

        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{namespace="shop-ecommerce"}[15m]) > 0
          for: 5m
          labels:
            severity: warning
            app: shop-ecommerce
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been restarting for 5 minutes"

        - alert: HighResponseLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(nginx_http_request_duration_seconds_bucket{namespace="shop-ecommerce"}[5m])) by (le)
            ) > 2
          for: 3m
          labels:
            severity: warning
            app: shop-ecommerce
          annotations:
            summary: "High response latency in shop-ecommerce"
            description: "P95 latency is above 2 seconds for 3 minutes. Current value: {{ $value }}s"

        - alert: PodMemoryHigh
          expr: |
            container_memory_working_set_bytes{namespace="shop-ecommerce", container!=""}
            / container_spec_memory_limit_bytes{namespace="shop-ecommerce", container!=""} > 0.85
          for: 5m
          labels:
            severity: warning
            app: shop-ecommerce
          annotations:
            summary: "Pod {{ $labels.pod }} memory usage above 85%"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of its memory limit"

        - alert: MySQLDown
          expr: up{job="mysql", namespace="shop-ecommerce"} == 0
          for: 1m
          labels:
            severity: critical
            app: shop-ecommerce
          annotations:
            summary: "MySQL is down in shop-ecommerce namespace"
            description: "MySQL has been unreachable for 1 minute"

        - alert: PodNotReady
          expr: kube_pod_status_ready{namespace="shop-ecommerce", condition="true"} == 0
          for: 3m
          labels:
            severity: warning
            app: shop-ecommerce
          annotations:
            summary: "Pod {{ $labels.pod }} is not ready"
            description: "Pod {{ $labels.pod }} has been in non-ready state for 3 minutes"
