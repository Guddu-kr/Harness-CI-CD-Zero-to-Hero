# ============================================
# SECRETS - Injected from AWS Secrets Manager via Harness
# Harness resolves <+secrets.getValue("xxx")> in values.yaml at deploy time
# Then Go templating injects resolved values into this manifest
#
# Flow: AWS Secrets Manager -> Harness Connector -> values.yaml -> secret.yaml
# Actual secret values NEVER appear in Git
# ============================================
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: mobile-ecommerce
  annotations:
    harness.io/skip-versioning: "true"
type: Opaque
stringData:
  MONGO_URI: {{.Values.mongoUri}}
  JWT_SECRET: {{.Values.jwtSecret}}
  JWT_REFRESH_SECRET: {{.Values.jwtRefreshSecret}}
