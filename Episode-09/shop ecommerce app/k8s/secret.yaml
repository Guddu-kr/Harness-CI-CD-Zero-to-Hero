# ============================================
# SECRET: Sensitive data injected from Harness Built-in Secret Manager
# Harness GitOps Agent resolves <+secrets.getValue("xxx")> in values.yaml
# Then Go templating injects resolved values into this manifest
#
# Flow: Harness Secrets → values.yaml → secret.yaml
# Actual secret values NEVER appear in Git
# ============================================
apiVersion: v1
kind: Secret
metadata:
  name: shop-ecommerce-secrets
  namespace: shop-ecommerce
  annotations:
    harness.io/skip-versioning: "true"
  labels:
    app: shop-ecommerce
type: Opaque
stringData:
  APP_KEY: { { .Values.appKey } }
  DB_USERNAME: { { .Values.dbUsername } }
  DB_PASSWORD: { { .Values.dbPassword } }
  STRIPE_KEY: { { .Values.stripeKey } }
  STRIPE_SECRET: { { .Values.stripeSecret } }
  MAIL_HOST: { { .Values.mailHost } }
  MAIL_USERNAME: { { .Values.mailUsername } }
  MAIL_PASSWORD: { { .Values.mailPassword } }
