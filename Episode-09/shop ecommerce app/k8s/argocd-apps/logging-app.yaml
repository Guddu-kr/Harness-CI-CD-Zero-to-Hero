# ArgoCD Application — deploys all EFK manifests (X-Pack security enabled)
# CHANGE: repoURL to YOUR GitHub repo URL
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging
  namespace: gitops
  labels:
    app.kubernetes.io/part-of: observability
spec:
  project: default
  source:
    # CHANGE THIS: Your GitHub repo URL
    repoURL: https://github.com/YOUR-USERNAME/Harness-CI-CD-Zero-to-Hero.git
    targetRevision: master
    path: "Episode-09/shop ecommerce app/k8s/logging"
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
