# ============================================
# DEPLOYMENT — Manages GoCart pods (creates, updates, scales)
#
# KEY VALUES FROM values.yaml:
#   {{ .Values.replicaCount }}           → 2 (number of pods)
#   {{ .Values.image.repository }}       → ECR URL (filled by Harness at deploy time)
#   {{ .Values.image.tag }}              → v5 (filled by Harness at deploy time)
#   {{ .Values.image.pullPolicy }}       → IfNotPresent
#   {{ .Values.service.targetPort }}     → 3000
#   {{- toYaml .Values.resources | nindent 12 }} → copies entire resources block from values.yaml
#
# STRATEGY: RollingUpdate with maxUnavailable: 0 = zero downtime
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gocart
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "gocart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gocart
  template:
    metadata:
      labels:
        app: gocart
    spec:
      containers:
        - name: gocart
          # Harness replaces image.repository and image.tag via artifact source
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
          # Inject env vars from ConfigMap + Secret
          envFrom:
            - configMapRef:
                name: gocart-config
            - secretRef:
                name: gocart-secrets
          # toYaml → converts the YAML block from values.yaml as-is
          # nindent 12 → adds 12 spaces of indentation
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Readiness: "Is pod ready to receive traffic?"
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: {{ .Values.readinessProbe.port }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          # Liveness: "Is pod still alive?" (restarts if fails)
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: {{ .Values.livenessProbe.port }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
