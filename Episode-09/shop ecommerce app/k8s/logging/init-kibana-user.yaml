# ============================================
# Init Job: Sets kibana_system password + creates data view
# Runs AFTER Elasticsearch is ready
# After this: Kibana login works + shows logs immediately
# ============================================
apiVersion: batch/v1
kind: Job
metadata:
  name: init-kibana-user
  namespace: logging
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Elasticsearch..."
              until curl -s -u elastic:${ELASTIC_PASSWORD} http://elasticsearch:9200/_cluster/health | grep -q '"status"'; do
                sleep 5
              done

              echo "Setting kibana_system password..."
              curl -s -X POST -u elastic:${ELASTIC_PASSWORD} \
                -H "Content-Type: application/json" \
                http://elasticsearch:9200/_security/user/kibana_system/_password \
                -d "{\"password\":\"${KIBANA_SYSTEM_PASSWORD}\"}"

              echo ""
              echo "Waiting for Kibana to be ready..."
              until curl -s http://kibana:5601/api/status | grep -q '"overall"'; do
                sleep 10
              done

              echo "Creating data view (index pattern) for k8s-logs-*..."
              curl -s -X POST -u elastic:${ELASTIC_PASSWORD} \
                -H "Content-Type: application/json" \
                -H "kbn-xsrf: true" \
                http://kibana:5601/api/data_views/data_view \
                -d '{
                  "data_view": {
                    "title": "k8s-logs-*",
                    "timeFieldName": "@timestamp",
                    "name": "Kubernetes Logs"
                  }
                }' || echo "Data view may already exist"

              echo ""
              echo "Setting as default data view..."
              curl -s -X POST -u elastic:${ELASTIC_PASSWORD} \
                -H "Content-Type: application/json" \
                -H "kbn-xsrf: true" \
                http://kibana:5601/api/data_views/default \
                -d '{
                  "data_view_id": "k8s-logs-*",
                  "force": true
                }' || echo "Default already set"

              echo ""
              echo "Done! Kibana ready with data view."
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: ELASTIC_PASSWORD
            - name: KIBANA_SYSTEM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: KIBANA_SYSTEM_PASSWORD
