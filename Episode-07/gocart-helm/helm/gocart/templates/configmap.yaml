# ============================================
# CONFIGMAP — Non-secret configuration
#
# {{- range $key, $value := .Values.env }}
#   This LOOPS over all key-value pairs in values.yaml → env section:
#   env:
#     NODE_ENV: "production"      → generates: NODE_ENV: "production"
#     APP_NAME: "GoCart"          → generates: APP_NAME: "GoCart"
#     PORT: "3000"                → generates: PORT: "3000"
#
# | quote → wraps value in quotes
# {{- end }} → ends the loop
# ============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: gocart-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "gocart.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
