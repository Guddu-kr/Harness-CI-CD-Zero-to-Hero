# ============================================
# VALUES.YAML — App configuration
# ============================================
# Secrets are NOT here — they're created by the pipeline separately.
# This file only has non-sensitive config + image reference.
# ============================================

# Image (updated by GitOpsUpdateReleaseRepo step via PR)
image: <+artifact.image>

replicas: 2

# Database connection (non-sensitive — points to K8s service)
dbHost: mysql-service.shop-ecommerce.svc.cluster.local
dbPort: "3306"
dbDatabase: shop_ecommerce
