# ============================================
# PIPELINE: Cleanup — Delete GoCart from EKS + ECR
# ============================================
# Run this AFTER you're done with the demo to stop billing.
# Deletes: K8s namespace (all pods, services, PVCs) + ECR repository
#
# ============================================
# CHANGE THESE VALUES:
# ============================================
#   projectIdentifier: HarnessCICDZerotoHero  ← Your project ID
#   orgIdentifier: default                    ← Your org name
#   serviceRef: gocart                        ← Your service ID
#   environmentRef: development               ← Your environment ID
#   infrastructureDefinitions: k8sdelegate    ← Your infra ID
# ============================================
pipeline:
  name: episode6-gocart-cleanup
  identifier: episode6_gocart_cleanup
  # CHANGE THIS: Your project ID
  projectIdentifier: HarnessCICDZerotoHero
  # CHANGE THIS: Your org name
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: cleanup
        identifier: cleanup
        description: "Delete K8s resources + ECR repo"
        type: Deployment
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: Ignore
        spec:
          deploymentType: Kubernetes
          service:
            # CHANGE THIS: Your service ID
            serviceRef: gocart
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: ecr_image
                      sources:
                        - identifier: ecr_image
                          type: Ecr
                          spec:
                            tag: latest
          environment:
            # CHANGE THIS: Your environment ID
            environmentRef: development
            deployToAll: false
            infrastructureDefinitions:
              # CHANGE THIS: Your infrastructure ID
              - identifier: k8sdelegate
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Delete Namespace
                  identifier: delete_namespace
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |-
                          kubectl delete namespace gocart --ignore-not-found=true
                          echo "Namespace gocart deleted"
                    onDelegate: true
                  timeout: 5m

              - step:
                  type: ShellScript
                  name: Delete ECR
                  identifier: delete_ecr
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |-
                          aws ecr delete-repository --repository-name gocart --force --region <+variable.aws_region> || true
                          echo "ECR repo gocart deleted"
                    onDelegate: true
                  timeout: 5m
            rollbackSteps: []
