# ============================================
# PIPELINE: Episode 9 — GitOps & Observability
# ============================================
# Stage 1: Build Laravel image → Push to ECR
# Stage 2: GitOps → Update values.yaml PR → Approve → Merge → ArgoCD Sync → Verify
#
# CHANGE THESE:
#   projectIdentifier, orgIdentifier, connectorRef, repoName,
#   serviceRef, environmentRef, gitOpsClusters, applicationName
#
# PREREQUISITES:
#   - account.Github, account.aws_account, account.k8sdelegate connectors
#   - Secrets: aws_access_key_id, aws_secret_access_key, slack_webhook_url
#   - Variables: aws_account_id, aws_region
#   - EKS cluster + K8s Delegate + GitOps Agent + Prometheus installed
#   - GitOps Application "shop-ecommerce" created in Harness UI
#   - Service: shopecommerce (Release Repo Manifest + ECR artifact)
#   - Environment: production (GitOps Cluster linked)
# ============================================
pipeline:
  name: episode9-shop-ecommerce-gitops
  identifier: episode9_shop_ecommerce_gitops
  # CHANGE THIS: Your project ID (find in URL after /projects/)
  projectIdentifier: HarnessCICDZerotoHero
  # CHANGE THIS: Your org name (usually "default")
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        # CHANGE THIS: Your GitHub connector (account level, created in Episode 1)
        connectorRef: account.Github
        # CHANGE THIS: Your GitHub repo name
        repoName: Harness-CI-CD-Zero-to-Hero
        build: <+input>
  stages:
    # ============================================
    # STAGE 1: Build & Push to ECR (runs on your EKS — KubernetesDirect)
    # ============================================
    - stage:
        name: build-and-push
        identifier: build_and_push
        description: "Build Docker image and push to ECR"
        type: CI
        spec:
          cloneCodebase: true
          # KubernetesDirect = builds on your EKS (MNC way, code stays in your VPC)
          infrastructure:
            type: KubernetesDirect
            spec:
              # CHANGE THIS: Your Kubernetes connector (uses delegate credentials)
              connectorRef: account.k8sdelegate
              # Namespace where CI build pods will run
              namespace: harness-delegate-ng
              automountServiceAccountToken: true
              os: Linux
          execution:
            steps:
              # Create ECR repo (needs access keys — aws-cli can't use OIDC)
              - step:
                  type: Run
                  name: Create ECR Repo
                  identifier: create_ecr
                  spec:
                    shell: Sh
                    image: amazon/aws-cli:latest
                    envVariables:
                      AWS_ACCESS_KEY_ID: <+secrets.getValue("aws_access_key_id")>
                      AWS_SECRET_ACCESS_KEY: <+secrets.getValue("aws_secret_access_key")>
                      AWS_DEFAULT_REGION: <+variable.aws_region>
                    command: |-
                      aws ecr create-repository --repository-name shop-ecommerce --region <+variable.aws_region> 2>/dev/null || echo "Repository already exists"

              # Build + Push (uses OIDC — no access keys needed)
              - step:
                  type: BuildAndPushECR
                  name: Build and Push to ECR
                  identifier: build_push_ecr
                  spec:
                    # CHANGE THIS: Your AWS OIDC connector (account level, created in Episode 3)
                    connectorRef: account.aws_account
                    region: <+variable.aws_region>
                    account: <+variable.aws_account_id>
                    imageName: shop-ecommerce
                    tags:
                      - v<+pipeline.sequenceId>
                      - latest
                    dockerfile: "Episode-09/shop ecommerce app/Dockerfile"
                    context: "Episode-09/shop ecommerce app"

    # ============================================
    # STAGE 2: GitOps Deploy (CD — gitOpsEnabled: true)
    # ============================================
    # This is a GITOPS deployment stage (NOT a regular K8s deploy).
    # Instead of kubectl apply, it:
    #   1. Updates values.yaml with new image tag (creates a PR)
    #   2. Waits for human approval
    #   3. Merges the PR into main branch
    #   4. Triggers ArgoCD to sync (apply manifests from Git to cluster)
    #   5. Verifies deployment health with Prometheus metrics
    # Source: https://github.com/harness-community/Gitops-Samples/tree/main/PR-Pipeline
    # ============================================
    - stage:
        name: gitops-deploy
        identifier: gitops_deploy
        description: "GitOps PR pipeline — update Git, ArgoCD syncs cluster"
        type: Deployment
        spec:
          deploymentType: Kubernetes
          # This flag enables GitOps-specific steps (UpdateReleaseRepo, MergePR, GitOpsSync)
          gitOpsEnabled: true
          service:
            # CHANGE THIS: Your service ID (create in CD → Services → Kubernetes + GitOps checkbox)
            serviceRef: shopecommerce
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      # CHANGE THIS: Must match Artifact Source Identifier in your Service
                      primaryArtifactRef: ecr_image
                      sources:
                        - identifier: ecr_image
                          type: Ecr
                          spec:
                            # Same tag as what we pushed in Stage 1
                            tag: v<+pipeline.sequenceId>
          environment:
            # CHANGE THIS: Your environment ID (create in CD → Environments → Production type)
            environmentRef: production
            deployToAll: false
            # GitOps uses gitOpsClusters (NOT infrastructureDefinitions)
            gitOpsClusters:
              # CHANGE THIS: Your GitOps cluster identifier (from Environment → GitOps Clusters)
              - identifier: shopcluster
                # CHANGE THIS: Your GitOps Agent identifier (installed in Step 2)
                agentIdentifier: gitopsagent
          execution:
            steps:
              # Updates "image" in values.yaml → creates PR in GitHub
              - step:
                  type: GitOpsUpdateReleaseRepo
                  name: Update Release Repo
                  identifier: update_release_repo
                  timeout: 10m
                  spec:
                    variables:
                      # "image" matches the key in k8s/values.yaml that holds the Docker image URL
                      - name: image
                        type: String
                        value: <+variable.aws_account_id>.dkr.ecr.<+variable.aws_region>.amazonaws.com/shop-ecommerce:v<+pipeline.sequenceId>
                    # Title of the PR that gets created in GitHub
                    prTitle: "Deploy shop-ecommerce build #<+pipeline.sequenceId>"

              # Pipeline pauses — someone must approve before merge
              - step:
                  type: HarnessApproval
                  name: Approve Deployment
                  identifier: approve_deployment
                  timeout: 1d
                  spec:
                    approvalMessage: "Approve deployment of build #<+pipeline.sequenceId> to production"
                    includePipelineExecutionHistory: true
                    isAutoRejectEnabled: false
                    approvers:
                      userGroups:
                        # _project_all_users = built-in group (all project members can approve)
                        - _project_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: false
                    approverInputs: []

              # Merges PR into main (deleteSourceBranch cleans up)
              - step:
                  type: MergePR
                  name: Merge PR
                  identifier: merge_pr
                  timeout: 10m
                  spec:
                    deleteSourceBranch: true
                    variables: []

              # Tells ArgoCD to sync NOW (instead of waiting 3 min poll)
              - step:
                  type: GitOpsSync
                  name: Sync Application
                  identifier: gitops_sync
                  timeout: 10m
                  spec:
                    prune: true
                    dryRun: false
                    applyOnly: false
                    forceApply: false
                    # CHANGE THIS: Your GitOps Application name + Agent ID
                    applicationsList:
                      - applicationName: shop-ecommerce
                        agentId: gitopsagent
                    retryStrategy: {}
                    retry: false
                    syncOptions:
                      skipSchemaValidation: false
                      # Creates namespace if it doesn't exist
                      autoCreateNamespace: true
                      pruneResourcesAtLast: false
                      applyOutOfSyncOnly: false
                      replaceResources: false
                      prunePropagationPolicy: foreground

              # Monitors Prometheus 10 min — auto-rollback if metrics degrade
              - step:
                  type: Verify
                  name: Verify Deployment Health
                  identifier: verify_deployment
                  timeout: 15m
                  spec:
                    type: Rolling
                    monitoredService:
                      type: Default
                      spec: {}
                    spec:
                      sensitivity: MEDIUM
                      duration: 10m
                      deploymentTag: v<+pipeline.sequenceId>

            # Rollback: syncs ArgoCD to previous healthy revision
            rollbackSteps:
              - step:
                  type: GitOpsSync
                  name: Rollback Sync
                  identifier: rollback_sync
                  timeout: 10m
                  spec:
                    prune: true
                    dryRun: false
                    applyOnly: false
                    forceApply: false
                    applicationsList:
                      - applicationName: shop-ecommerce
                        agentId: gitopsagent
                    retryStrategy: {}
                    retry: false
                    syncOptions:
                      skipSchemaValidation: false
                      autoCreateNamespace: false
                      pruneResourcesAtLast: false
                      applyOutOfSyncOnly: false
                      replaceResources: false
                      prunePropagationPolicy: foreground
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        gitOpsEnabled: true

  # Slack notification on success/failure
  notificationRules:
    - name: Pipeline Notifications
      enabled: true
      pipelineEvents:
        - type: PipelineSuccess
        - type: PipelineFailed
        - type: StageSuccess
          forStages:
            - gitops_deploy
      notificationMethod:
        type: Slack
        spec:
          webhookUrl: <+secrets.getValue("slack_webhook_url")>
