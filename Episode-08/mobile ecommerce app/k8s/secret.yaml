# ============================================
# SECRETS — Stored in Harness Secret Manager (NOT hardcoded!)
# These values come from: Project Settings → Secrets
# Or from AWS Secrets Manager connected to Harness
#
# How it works:
#   1. Store MONGO_URI in Harness Secrets (or AWS Secrets Manager)
#   2. Harness resolves <+secrets.getValue("xxx")> at deploy time
#   3. Actual secret value never appears in Git
# ============================================
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: mobile-ecommerce
type: Opaque
stringData:
  MONGO_URI: <+secrets.getValue("mongo_uri")>
  JWT_SECRET: <+secrets.getValue("jwt_secret")>
  JWT_REFRESH_SECRET: <+secrets.getValue("jwt_refresh_secret")>
