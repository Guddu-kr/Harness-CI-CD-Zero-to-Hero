# ============================================
# PIPELINE: Episode 9 — GitOps & Observability (Shop Ecommerce)
# ============================================
#
# WHAT THIS PIPELINE DOES:
#   Stage 1 (CI): Build Laravel Docker image → Push to Amazon ECR
#   Stage 2 (CD): GitOps PR Pipeline → Update image tag in values.yaml
#                 → Human approval → Merge PR → ArgoCD syncs to cluster
#                 → Verify deployment health with Prometheus
#
# HOW GITOPS WORKS (different from Episodes 6-8):
#   Episodes 6-8: Pipeline PUSHES to cluster (K8sRollingDeploy)
#   Episode 9:    Pipeline updates Git → ArgoCD PULLS from Git → Cluster updates
#
#   Flow: Build image → Update values.yaml (PR) → Approve → Merge → ArgoCD syncs
#         If metrics degrade after sync → auto-rollback via GitOpsSync
#
# ============================================
# CHANGE THESE VALUES (to match YOUR Harness account):
# ============================================
#   projectIdentifier: HarnessCICDZerotoHero  ← Your project ID (find in URL after /projects/)
#   orgIdentifier: default                    ← Your org name
#   connectorRef: account.Github              ← Your GitHub connector (created in Episode 1)
#   repoName: Harness-CI-CD-Zero-to-Hero      ← Your GitHub repo name
#   connectorRef: account.aws_account         ← Your AWS OIDC connector (created in Episode 3)
#   connectorRef: account.k8sdelegate         ← Your K8s connector (delegate-based, created in Episode 6)
#   serviceRef: shopecommerce                 ← Your service ID (create in CD → Services)
#   environmentRef: production                ← Your environment ID (create in CD → Environments)
#   gitOpsClusters → identifier: shopcluster  ← Your GitOps cluster ID (linked in Environment)
#   gitOpsClusters → agentIdentifier: gitopsagent ← Your GitOps Agent ID (installed in Step 2)
#   applicationName: shop-ecommerce           ← Your GitOps Application name (created in Step 4)
#
# ============================================
# PREREQUISITES (must be done before running):
# ============================================
#   1. account.Github connector — Episode 1
#   2. account.aws_account OIDC connector — Episode 3
#   3. Secret: aws_access_key_id — Episode 3
#   4. Secret: aws_secret_access_key — Episode 3
#   5. Variable: aws_account_id — Episode 4
#   6. Variable: aws_region — Episode 3
#   7. EKS cluster running (GitHub Actions → infra.yml → apply)
#   8. K8s Delegate installed on EKS (Helm — Episode 6)
#   9. GitOps Agent installed in "gitops" namespace (Episode 9 — Step 2)
#  10. GitOps Repository connected to GitHub (Episode 9 — Step 3)
#  11. GitOps Application: shop-ecommerce (Episode 9 — Step 4)
#  12. Service: shopecommerce — Kubernetes + GitOps + Release Repo Manifest (Episode 9 — Step 9)
#  13. Environment: production + GitOps Cluster linked (Episode 9 — Step 10)
#  14. Secrets in Harness: shop_app_key, shop_db_username, shop_db_password,
#      shop_stripe_key, shop_stripe_secret, shop_mail_host, shop_mail_username,
#      shop_mail_password (Episode 9 — Step 7)
#  15. Prometheus + Grafana installed in "monitoring" namespace (Episode 9 — Step 1)
#  16. Prometheus connector + Monitored Service in Harness (Episode 9 — Step 11 in DEPLOY-STEPS.md)
#  17. Secret: slack_webhook_url (for notifications)
#
# ============================================
# CI INFRASTRUCTURE: KubernetesDirect (MNC/Production way)
# ============================================
#   Unlike Episodes 1-8 (Harness Cloud), Episode 9 uses KubernetesDirect.
#   This means CI builds run on YOUR OWN EKS cluster (same one used for deployment).
#   Why: Code never leaves your VPC. This is how real enterprises do it.
#   The EKS cluster is already running (for GitOps Agent), so no extra cost.
#
# ============================================
pipeline:
  name: episode9-shop-ecommerce-gitops
  identifier: episode9_shop_ecommerce_gitops
  # CHANGE THIS: Your project ID (find in URL after /projects/)
  projectIdentifier: HarnessCICDZerotoHero
  # CHANGE THIS: Your org name (usually "default")
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        # CHANGE THIS: Your GitHub connector (account level, created in Episode 1)
        connectorRef: account.Github
        # CHANGE THIS: Your GitHub repo name
        repoName: Harness-CI-CD-Zero-to-Hero
        build: <+input>
  stages:
    # ============================================
    # STAGE 1: Build & Push to ECR
    # ============================================
    # Runs on your EKS cluster (KubernetesDirect)
    # Builds the Laravel Docker image and pushes to Amazon ECR
    # Uses OIDC connector (no access keys needed for BuildAndPushECR)
    # Access keys only needed for "Create ECR Repo" step (aws-cli needs them)
    # ============================================
    - stage:
        name: build-and-push
        identifier: build_and_push
        description: "Build Shop Ecommerce Docker image and push to ECR"
        type: CI
        spec:
          cloneCodebase: true
          # KubernetesDirect: Builds run on YOUR EKS cluster (not Harness Cloud)
          # connectorRef: Your K8s connector (delegate-based, created in Episode 6)
          # namespace: Where build pods spawn (same namespace as delegate)
          infrastructure:
            type: KubernetesDirect
            spec:
              # CHANGE THIS: Your Kubernetes connector (uses delegate credentials)
              connectorRef: account.k8sdelegate
              # Namespace where CI build pods will run
              namespace: harness-delegate-ng
              automountServiceAccountToken: true
              os: Linux
          execution:
            steps:
              # Step 1: Create ECR repository (idempotent — skips if exists)
              # Why access keys here: aws-cli in a Run step cannot use OIDC
              # BuildAndPushECR uses OIDC automatically (no keys needed for that step)
              - step:
                  type: Run
                  name: Create ECR Repo
                  identifier: create_ecr
                  spec:
                    shell: Sh
                    image: amazon/aws-cli:latest
                    envVariables:
                      AWS_ACCESS_KEY_ID: <+secrets.getValue("aws_access_key_id")>
                      AWS_SECRET_ACCESS_KEY: <+secrets.getValue("aws_secret_access_key")>
                      AWS_DEFAULT_REGION: <+variable.aws_region>
                    command: |-
                      aws ecr create-repository --repository-name shop-ecommerce --region <+variable.aws_region> 2>/dev/null || echo "Repository already exists"

              # Step 2: Build Docker image and push to ECR
              # Uses OIDC connector (account.aws_account) — no access keys needed
              # Tags: v<sequenceId> (unique per build) + latest
              - step:
                  type: BuildAndPushECR
                  name: Build and Push to ECR
                  identifier: build_push_ecr
                  spec:
                    # CHANGE THIS: Your AWS OIDC connector (account level, created in Episode 3)
                    connectorRef: account.aws_account
                    region: <+variable.aws_region>
                    account: <+variable.aws_account_id>
                    imageName: shop-ecommerce
                    tags:
                      - v<+pipeline.sequenceId>
                      - latest
                    # Path to Dockerfile (relative to repo root)
                    dockerfile: "Episode-09/shop ecommerce app/Dockerfile"
                    # Build context (folder containing code to COPY into image)
                    context: "Episode-09/shop ecommerce app"

    # ============================================
    # STAGE 2: GitOps Deploy (CD — gitOpsEnabled: true)
    # ============================================
    # This is a GITOPS deployment stage (NOT a regular K8s deploy).
    # Instead of kubectl apply, it:
    #   1. Updates values.yaml with new image tag (creates a PR)
    #   2. Waits for human approval
    #   3. Merges the PR into main branch
    #   4. Triggers ArgoCD to sync (apply manifests from Git to cluster)
    #   5. Verifies deployment health with Prometheus metrics
    #
    # Key differences from Episodes 6-8:
    #   - gitOpsEnabled: true (enables GitOps steps)
    #   - gitOpsClusters (NOT infrastructureDefinitions)
    #   - GitOpsUpdateReleaseRepo + MergePR + GitOpsSync (NOT K8sRollingDeploy)
    #   - Service uses "Release Repo Manifest" (NOT K8s Manifest)
    #
    # Source: https://github.com/harness-community/Gitops-Samples/tree/main/PR-Pipeline
    # ============================================
    - stage:
        name: gitops-deploy
        identifier: gitops_deploy
        description: "Update values, create PR, approve, merge, sync via GitOps"
        type: Deployment
        spec:
          deploymentType: Kubernetes
          # This flag enables GitOps-specific steps (UpdateReleaseRepo, MergePR, GitOpsSync)
          gitOpsEnabled: true
          service:
            # CHANGE THIS: Your service ID (create in CD → Services → Kubernetes + GitOps checkbox)
            serviceRef: shopecommerce
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      # CHANGE THIS: Must match Artifact Source Identifier in your Service
                      primaryArtifactRef: ecr_image
                      sources:
                        - identifier: ecr_image
                          type: Ecr
                          spec:
                            # Same tag as what we pushed in Stage 1
                            tag: v<+pipeline.sequenceId>
          environment:
            # CHANGE THIS: Your environment ID (create in CD → Environments → Production type)
            environmentRef: production
            deployToAll: false
            # GitOps uses clusters (NOT infrastructureDefinitions like Episodes 6-8)
            # Link this cluster in: Environment → GitOps Clusters tab → + Select Cluster(s)
            gitOpsClusters:
              # CHANGE THIS: Your GitOps cluster identifier (from Environment → GitOps Clusters)
              - identifier: shopcluster
                # CHANGE THIS: Your GitOps Agent identifier (installed in Step 2)
                agentIdentifier: gitopsagent
          execution:
            steps:
              # Step 1: Update Release Repo (creates a PR)
              # This step:
              #   - Clones your repo
              #   - Updates the "image" variable in values.yaml with new ECR URL:tag
              #   - Commits to a new branch
              #   - Creates a Pull Request targeting main branch
              # The variable name "image" must match what's in your values.yaml
              - step:
                  type: GitOpsUpdateReleaseRepo
                  name: Update Release Repo
                  identifier: update_release_repo
                  timeout: 10m
                  spec:
                    variables:
                      # "image" matches the key in k8s/values.yaml that holds the Docker image URL
                      - name: image
                        type: String
                        value: <+variable.aws_account_id>.dkr.ecr.<+variable.aws_region>.amazonaws.com/shop-ecommerce:v<+pipeline.sequenceId>
                    # Title of the PR that gets created in GitHub
                    prTitle: "Deploy shop-ecommerce build #<+pipeline.sequenceId>"

              # Step 2: Human Approval (pipeline pauses here)
              # Someone must review the PR in GitHub and click Approve in Harness
              # This prevents accidental deployments to production
              - step:
                  type: HarnessApproval
                  name: Approve Deployment
                  identifier: approve_deployment
                  timeout: 1d
                  spec:
                    approvalMessage: "Review PR and approve deployment of shop-ecommerce build #<+pipeline.sequenceId> to production"
                    includePipelineExecutionHistory: true
                    isAutoRejectEnabled: false
                    approvers:
                      userGroups:
                        # _project_all_users = built-in group (all project members can approve)
                        - _project_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: false
                    approverInputs: []

              # Step 3: Merge PR (after approval)
              # Merges the PR created in Step 1 into main branch
              # deleteSourceBranch: true — cleans up the temporary branch
              - step:
                  type: MergePR
                  name: Merge PR
                  identifier: merge_pr
                  timeout: 10m
                  spec:
                    deleteSourceBranch: true
                    variables: []

              # Step 4: GitOps Sync (trigger ArgoCD)
              # After PR is merged, this tells ArgoCD to sync NOW
              # Without this step, ArgoCD would still sync (within 3 min polling)
              # But this makes it instant + visible in pipeline execution
              - step:
                  type: GitOpsSync
                  name: Sync Application
                  identifier: gitops_sync
                  timeout: 10m
                  spec:
                    prune: true
                    dryRun: false
                    applyOnly: false
                    forceApply: false
                    # CHANGE THIS: Your GitOps Application name + Agent ID
                    applicationsList:
                      - applicationName: shop-ecommerce
                        agentId: gitopsagent
                    retryStrategy: {}
                    retry: false
                    syncOptions:
                      skipSchemaValidation: false
                      # Creates namespace if it doesn't exist
                      autoCreateNamespace: true
                      pruneResourcesAtLast: false
                      applyOutOfSyncOnly: false
                      replaceResources: false
                      prunePropagationPolicy: foreground

              # Step 5: Continuous Verification (Harness CV)
              # Queries Prometheus for 10 minutes after deployment
              # Compares current metrics to baseline (before deploy)
              # If error rate increases or latency spikes → triggers rollback
              # Requires: Prometheus connector + Monitored Service configured in Harness
              - step:
                  type: Verify
                  name: Verify Deployment Health
                  identifier: verify_deployment
                  timeout: 15m
                  spec:
                    type: Rolling
                    monitoredService:
                      type: Default
                      spec: {}
                    spec:
                      sensitivity: MEDIUM
                      duration: 10m
                      deploymentTag: v<+pipeline.sequenceId>

            # ============================================
            # ROLLBACK (auto-triggered if Verify step fails)
            # ============================================
            # If Prometheus metrics show degradation, this syncs ArgoCD
            # back to the previous healthy Git revision (previous commit)
            rollbackSteps:
              - step:
                  type: GitOpsSync
                  name: Rollback Sync
                  identifier: rollback_sync
                  timeout: 10m
                  spec:
                    prune: true
                    dryRun: false
                    applyOnly: false
                    forceApply: false
                    applicationsList:
                      - applicationName: shop-ecommerce
                        agentId: gitopsagent
                    retryStrategy: {}
                    retry: false
                    syncOptions:
                      skipSchemaValidation: false
                      autoCreateNamespace: false
                      pruneResourcesAtLast: false
                      applyOutOfSyncOnly: false
                      replaceResources: false
                      prunePropagationPolicy: foreground
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        gitOpsEnabled: true

  # ============================================
  # NOTIFICATIONS: Slack + Email on pipeline events
  # ============================================
  # Slack: Sends message on success/failure/stage completion
  # Email: Sends to pipeline executor on failure only
  # Create slack_webhook_url secret: Slack App → Incoming Webhooks → Copy URL → Harness Secrets
  notificationRules:
    - name: Pipeline Notifications
      enabled: true
      pipelineEvents:
        - type: PipelineSuccess
        - type: PipelineFailed
        - type: StageSuccess
          forStages:
            - gitops_deploy
      notificationMethod:
        type: Slack
        spec:
          webhookUrl: <+secrets.getValue("slack_webhook_url")>

    - name: Email Notifications
      enabled: true
      pipelineEvents:
        - type: PipelineFailed
      notificationMethod:
        type: Email
        spec:
          recipients:
            - <+pipeline.triggeredBy.email>
