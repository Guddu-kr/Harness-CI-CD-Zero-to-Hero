# Grafana deployment with persistent storage and provisioned datasources
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: admin-password
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboard-provisioning
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboards-cluster
              mountPath: /var/lib/grafana/dashboards/cluster
            - name: grafana-dashboards-nodes
              mountPath: /var/lib/grafana/dashboards/nodes
            - name: grafana-dashboards-pods
              mountPath: /var/lib/grafana/dashboards/pods
            - name: grafana-dashboards-platform
              mountPath: /var/lib/grafana/dashboards/platform
            - name: grafana-dashboards-data-layer
              mountPath: /var/lib/grafana/dashboards/data-layer
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboard-provisioning
          configMap:
            name: grafana-dashboard-provisioning
        - name: grafana-dashboards-cluster
          configMap:
            name: grafana-dashboards-k8s
        - name: grafana-dashboards-nodes
          configMap:
            name: grafana-dashboards-nodes
        - name: grafana-dashboards-pods
          configMap:
            name: grafana-dashboards-pods
        - name: grafana-dashboards-platform
          configMap:
            name: grafana-dashboards-platform
        - name: grafana-dashboards-data-layer
          configMap:
            name: grafana-dashboards-data-layer
