# ============================================
# PIPELINE 1: Observability Infrastructure (Run ONCE)
# ============================================
# MNC Pattern:
#   - Helm for Prometheus + Grafana (kube-prometheus-stack)
#   - kubectl apply for EFK (custom manifests)
#   - kubectl apply for OTel + Jaeger (simple manifests)
#   - ArgoCD only for app deployment (not infra)
# ============================================
pipeline:
  name: episode9-observability-infra
  identifier: episode9_observability_infra
  projectIdentifier: HarnessCICDZerotoHero # ← CHANGE: your project ID
  orgIdentifier: default # ← CHANGE: your org
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: account.Github # ← CHANGE: your GitHub connector
        repoName: Harness-CI-CD-Zero-to-Hero # ← CHANGE: your repo name
        build: <+input>
  stages:
    - stage:
        name: install-observability
        identifier: install_observability
        description: "Install full observability stack"
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: k8sdelegate # ← CHANGE: your K8s connector
              namespace: harness-delegate-ng
              automountServiceAccountToken: true
              os: Linux
          execution:
            steps:
              # Step 1: StorageClass
              - step:
                  type: Run
                  name: Create StorageClass
                  identifier: create_storageclass
                  spec:
                    connectorRef: dockerhub
                    shell: Sh
                    image: bitnami/kubectl:latest
                    command: |-
                      kubectl apply -f "Episode-09/shop ecommerce app/k8s/storageclass.yaml"

              # Step 2: Prometheus + Grafana (Helm)
              - step:
                  type: Run
                  name: Install Prometheus + Grafana
                  identifier: install_prometheus_grafana
                  spec:
                    connectorRef: dockerhub
                    shell: Sh
                    image: alpine/helm:latest
                    command: |-
                      helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
                      helm repo update
                      helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
                        --namespace monitoring --create-namespace \
                        --set grafana.adminPassword=admin123 \
                        --set grafana.service.type=LoadBalancer \
                        --set "grafana.service.annotations.service\\.beta\\.kubernetes\\.io/aws-load-balancer-scheme=internet-facing" \
                        --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false \
                        --wait --timeout 5m

              # Step 3: EFK
              - step:
                  type: Run
                  name: Install EFK
                  identifier: install_efk
                  spec:
                    connectorRef: dockerhub
                    shell: Sh
                    image: bitnami/kubectl:latest
                    command: |-
                      cd "Episode-09/shop ecommerce app/k8s/logging"
                      kubectl apply -f namespace.yaml
                      kubectl apply -f credentials-secret.yaml
                      kubectl apply -f elasticsearch.yaml
                      kubectl wait --for=condition=ready pod -l app=elasticsearch -n logging --timeout=180s 2>/dev/null || echo "ES starting..."
                      kubectl apply -f init-kibana-user.yaml
                      kubectl wait --for=condition=complete job/init-kibana-user -n logging --timeout=60s 2>/dev/null || true
                      kubectl apply -f fluentd.yaml
                      kubectl apply -f kibana.yaml

              # Step 4: OTel + Jaeger
              - step:
                  type: Run
                  name: Install Tracing
                  identifier: install_tracing
                  spec:
                    connectorRef: dockerhub
                    shell: Sh
                    image: bitnami/kubectl:latest
                    command: |-
                      cd "Episode-09/shop ecommerce app/k8s/tracing"
                      kubectl apply -f namespace.yaml
                      kubectl apply -f otel-collector/configmap.yaml
                      kubectl apply -f otel-collector/deployment.yaml
                      kubectl apply -f otel-collector/service.yaml
                      kubectl apply -f jaeger/deployment.yaml
                      kubectl apply -f jaeger/service.yaml

              # Step 5: Get URLs
              - step:
                  type: Run
                  name: Get All URLs
                  identifier: get_all_urls
                  spec:
                    connectorRef: dockerhub
                    shell: Sh
                    image: bitnami/kubectl:latest
                    command: |-
                      sleep 30
                      GRAFANA=$(kubectl get svc prometheus-grafana -n monitoring -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "pending")
                      KIBANA=$(kubectl get svc kibana -n logging -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "pending")
                      JAEGER=$(kubectl get svc jaeger-query -n tracing -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "pending")
                      echo "=============================================="
                      echo "  OBSERVABILITY STACK READY"
                      echo "=============================================="
                      echo "  1. GRAFANA:  http://$GRAFANA"
                      echo "     Login:    admin / admin123"
                      echo "  2. KIBANA:   http://$KIBANA"
                      echo "     Login:    elastic / HarnessEFK@2026"
                      echo "  3. JAEGER:   http://$JAEGER"
                      echo "=============================================="
