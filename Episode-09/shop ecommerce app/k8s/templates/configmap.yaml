# ============================================
# CONFIGMAP: Non-secret configuration for Laravel app
# Changes here do NOT require rebuilding the Docker image
# ============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-ecommerce-config
  namespace: shop-ecommerce
  annotations:
    harness.io/skip-versioning: "true"
  labels:
    app: shop-ecommerce
data:
  APP_NAME: "ShopEcommerce"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://shop-ecommerce.example.com"
  LOG_CHANNEL: "stderr"
  LOG_LEVEL: "warning"
  DB_CONNECTION: "mysql"
  DB_PORT: "3306"
  BROADCAST_DRIVER: "log"
  CACHE_DRIVER: "file"
  FILESYSTEM_DISK: "local"
  QUEUE_CONNECTION: "sync"
  SESSION_DRIVER: "file"
  SESSION_LIFETIME: "120"
  MAIL_MAILER: "smtp"
  MAIL_PORT: "587"
  MAIL_ENCRYPTION: "tls"
  MAIL_FROM_ADDRESS: "shop@example.com"
  MAIL_FROM_NAME: "ShopEcommerce"
