# Grafana datasource provisioning configmap
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: true

      - name: Elasticsearch
        type: elasticsearch
        access: proxy
        url: http://elasticsearch.logging.svc.cluster.local:9200
        database: "k8s-logs-*"
        editable: true
        jsonData:
          timeField: "@timestamp"
          esVersion: "8.0.0"

      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger-query.tracing.svc.cluster.local:16686
        editable: true
